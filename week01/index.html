<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Week 1 Starter — Canvas &amp; Clear Color</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>

<body>
    <canvas id="gl-canvas"></canvas>
    <script>
        const canvas = document.getElementById("gl-canvas");
        const gl = canvas.getContext("webgl2");

        if (!gl) {
            throw new Error("WebGL2 is not available on this device/browser.");
        }

        function resizeCanvasToDisplaySize() {
            const dpr = window.devicePixelRatio || 1;
            const width = Math.round(canvas.clientWidth * dpr);
            const height = Math.round(canvas.clientHeight * dpr);
            if (canvas.width !== width || canvas.height !== height) {
                canvas.width = width;
                canvas.height = height;
            }
        }

        const colors = [];
        for (let i = 0; i < 3; i++) {
            const currColor = [];
            for (let j = 0; j < 3; j++) currColor.push(Math.random());
            colors.push(currColor);
        }
        let colorIndex = 0;

        render();

        function render() {
            resizeCanvasToDisplaySize();
            gl.viewport(0, 0, canvas.width, canvas.height);

            // TODO(student): try changing these values
            // gl.clearColor(0.1, 0.15, 0.35, 1.0);
            gl.clearColor(colors[colorIndex][0], colors[colorIndex][1], colors[colorIndex][2], 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT);
        }

        window.addEventListener("resize", render);
        setInterval(() => requestAnimationFrame(() => {
            colorIndex = (colorIndex + 1) % colors.length;
            render();
            console.log(`RGB: ${colors[colorIndex]}`);
        }), 1000);
    </script>
</body>

</html>
